name: OpenSearch

# ghcr.io/samjuk/opensearch-slim: OpenSearch without its plugins, for the Magento demo stores (src/opensearch).
# Pull requests build and test it; master publishes it, for amd64 (servers, CI) and arm64 (local Macs). Consumers
# pin it by digest, so a rebuild changes nothing until they move.

on:
  push:
    branches: [master]
    paths: [src/opensearch/**, .github/workflows/opensearch.yml]
  pull_request:
    paths: [src/opensearch/**, .github/workflows/opensearch.yml]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/samjuk/opensearch-slim
  VERSION: 3.9.0

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build for amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/opensearch
          platforms: linux/amd64
          load: true
          tags: opensearch-slim:test
          cache-from: type=gha,scope=opensearch
          cache-to: type=gha,scope=opensearch,mode=max
      - name: Test
        run: sh src/opensearch/test.sh opensearch-slim:test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/opensearch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:${{ env.VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=opensearch
          provenance: mode=max
          sbom: true
      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Published \`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
